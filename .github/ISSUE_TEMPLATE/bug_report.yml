name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste secrets, internal hostnames or customer data.
        Security issues must go through the private channel described in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behaviour, with the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. main@1ba2eca
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agents / publishing
        - Chat / streaming
        - Skills / rollout
        - Knowledge / retrieval
        - MCP tool sources
        - Users / permissions / audit
        - Frontend UI
        - Deployment / configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Python, Node, database (SQLite/PostgreSQL), browser
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, keys, hostnames and personal data before pasting.
      render: shell
    validations:
      required: false
