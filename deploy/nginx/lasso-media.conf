# /media/ 鉴权直出（安装到 /etc/nginx/default.d/lasso-media.conf）
#
# 该文件由主配置的 `include /etc/nginx/default.d/*.conf;` 引入（server 上下文）。
# 不裸用 alias 暴露 MEDIA_ROOT：每个请求先经 auth_request 子请求校验，
# 通过后仍由 nginx 发送文件本体（Range/206 由 nginx 原生处理）。
#
# 鉴权顺序在 backend/apps/common/media_auth.py：
#   路径规范化 → 数据库记录 → 所有者 / 知识库可见范围
#   branding/ 是唯一的公开例外（登录页 LOGO），其余一律要求登录态。

# nginx 会先归一化 URI 再做 location 匹配，穿越必须在原始 URI 上拦截
if ($request_uri ~* "^[^?]*(\.\.|%2e%2e)") {
    return 403;
}

location /media/ {
    auth_request /_media_auth;
    alias /srv/lasso/media/;
    autoindex off;
    add_header Cache-Control "private, max-age=3600";
}

location = /_media_auth {
    internal;
    proxy_pass http://127.0.0.1:8000/api/media/auth/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # 子请求的 URI 是 /_media_auth，原始文件路径靠这个头传给后端
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
